<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="header">
    <h1>My Image Gallery</h1>
    <p>Click any image to view fullscreen</p>
  </div>

  <div class="gallery" id="gallery"></div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <div class="lightbox-backdrop" id="backdrop"></div>
    <div class="lightbox-close" id="closeBtn">
      <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </div>
    <span class="counter" id="counter"></span>
    <button class="lightbox-nav lightbox-prev" id="prevBtn">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="lightbox-content">
      <img id="lightboxImg" src="" alt="">
      <span class="lightbox-caption" id="lightboxCaption"></span>
    </div>
    <button class="lightbox-nav lightbox-next" id="nextBtn">
      <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>

  <script src="script.js"></script>
</body>
</html>
