<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration Form</title>
<link rel="stylesheet" href="style3.css">
</head>
<body>

<div class="container">
  <form id="myForm" novalidate>
    <h2>Registration Form</h2>

    <div class="field">
      <label for="name">Full Name</label>
      <input type="text" id="name" placeholder="Enter your name">
      <span class="err-msg" id="nameErr"></span>
    </div>

    <div class="field">
      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="Enter your email">
      <span class="err-msg" id="emailErr"></span>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Min 6 characters">
      <span class="err-msg" id="passwordErr"></span>
    </div>

    <div class="field">
      <label for="confirmPassword">Confirm Password</label>
      <input type="password" id="confirmPassword" placeholder="Repeat password">
      <span class="err-msg" id="confirmErr"></span>
    </div>

    <button type="submit">Register</button>
    <p id="message"></p>
  </form>
</div>

<script src="script.js"></script>
</body>
</html>
